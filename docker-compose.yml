version: '3.8'

services:
  # PostgreSQL database (local alternative to Supabase)
  db:
    image: postgres:16-alpine
    container_name: diabetes-cdss-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: diabetes_cdss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Mail catcher for development (SMTP)
  mailhog:
    image: mailhog/mailhog
    container_name: diabetes-cdss-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  postgres_data: