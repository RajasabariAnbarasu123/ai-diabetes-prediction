<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
    <div style="background-color: #1976d2; padding: 20px; text-align: center; color: white;">
        <h1>Diabetes CDSS</h1>
    </div>
    <div style="padding: 20px;">
        <p>Hello <span th:text="${name}">User</span>,</p>
        <p>Thank you for registering! Please verify your email address by clicking the button below.</p>
        <div style="text-align: center; margin: 30px 0;">
            <a th:href="${verificationLink}" style="background-color: #1976d2; color: white; padding: 12px 30px; text-decoration: none; border-radius: 4px; font-weight: bold;">
                Verify Email
            </a>
        </div>
        <p>If the button doesn't work, copy and paste the following link into your browser:</p>
        <p style="word-break: break-all; color: #666;" th:text="${verificationLink}"></p>
        <p>This link will expire in 24 hours.</p>
        <p>Best regards,<br/>Diabetes CDSS Team</p>
    </div>
</body>
</html>
