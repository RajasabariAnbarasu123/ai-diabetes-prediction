<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
    <div style="background-color: #1976d2; padding: 20px; text-align: center; color: white;">
        <h1>Diabetes Risk Assessment</h1>
    </div>
    <div style="padding: 20px;">
        <p>Hello <span th:text="${name}">User</span>,</p>
        <p>Your diabetes risk assessment is complete. Please find a summary below.</p>
        <div style="background-color: #f5f5f5; padding: 15px; border-radius: 4px; margin: 20px 0;">
            <p th:text="${reportContent}">Report content will appear here.</p>
        </div>
        <p>Log in to your dashboard for detailed recommendations.</p>
        <p>Best regards,<br/>Diabetes CDSS Team</p>
    </div>
</body>
</html>
